<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحية الكلاسيكية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 360px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas {
            background-color: #0d1b2a;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(46, 204, 113, 0.2);
            border: 2px solid #1b263b;
            max-width: 100%;
            height: auto;
        }

        /* أزرار التحكم للهواتف */
        .touch-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 200px;
            height: 200px;
            margin-top: 15px;
        }

        .arrow-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 22px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
            touch-action: manipulation;
        }

        .arrow-btn:active {
            background: rgba(46, 204, 113, 0.5);
            transform: scale(0.92);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .controls-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #a0aab2;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-over-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .game-over-title {
            font-size: 30px;
            color: #e74c3c;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .restart-btn {
            margin-top: 15px;
            background: #2ecc71;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .restart-btn:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .container-relative {
            position: relative;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="score-board">
        <div class="score-box">النقاط: <span id="currentScore" style="color:#2ecc71;">0</span></div>
        <div class="score-box">أعلى نتيجة: <span id="highScore" style="color:#f1c40f;">0</span></div>
    </div>

    <div class="container-relative">
        <canvas id="gameCanvas" width="360" height="360"></canvas>
        
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-title">خسرت!</div>
            <p id="finalScoreText" style="font-size: 16px;"></p>
            <button class="restart-btn" onclick="resetGame()">إعادة اللعب</button>
        </div>
    </div>

    <!-- أزرار اللمس للتلفون -->
    <div class="touch-controls">
        <button class="arrow-btn btn-up" onclick="changeDirection('UP')">▲</button>
        <button class="arrow-btn btn-left" onclick="changeDirection('LEFT')">◀</button>
        <button class="arrow-btn btn-right" onclick="changeDirection('RIGHT')">▶</button>
        <button class="arrow-btn btn-down" onclick="changeDirection('DOWN')">▼</button>
    </div>

    <div class="controls-hint">استخدم أزرار الشاشة للتلفون أو أسهم الكيبورد للكمبيوتر</div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const gridSize = 18;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 0, y: 0 };

    let dx = gridSize;
    let dy = 0;
    let nextDx = gridSize;
    let nextDy = 0;

    let score = 0;
    let highScore = localStorage.getItem("snakeHighScore") || 0;
    document.getElementById("highScore").innerText = highScore;

    let gameInterval;
    let isGameOver = false;

    function initGame() {
        snake = [
            { x: 10 * gridSize, y: 10 * gridSize },
            { x: 9 * gridSize, y: 10 * gridSize },
            { x: 8 * gridSize, y: 10 * gridSize }
        ];
        score = 0;
        dx = gridSize;
        dy = 0;
        nextDx = gridSize;
        nextDy = 0;
        isGameOver = false;
        document.getElementById("currentScore").innerText = score;
        document.getElementById("gameOverOverlay").classList.remove("active");
        spawnFood();
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 100);
    }

    function gameLoop() {
        if (isGameOver) return;

        dx = nextDx;
        dy = nextDy;

        moveSnake();

        if (checkCollision()) {
            handleGameOver();
            return;
        }

        drawGrid();
        drawFood();
        drawSnake();
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById("currentScore").innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                document.getElementById("highScore").innerText = highScore;
            }
            spawnFood();
        } else {
            snake.pop();
        }

        snake.unshift(head);
    }

    function checkCollision() {
        const head = snake[0];

        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
            return true;
        }

        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                return true;
            }
        }

        return false;
    }

    function spawnFood() {
        food.x = Math.floor(Math.random() * tileCount) * gridSize;
        food.y = Math.floor(Math.random() * tileCount) * gridSize;

        for (let segment of snake) {
            if (segment.x === food.x && segment.y === food.y) {
                spawnFood();
                break;
            }
        }
    }

    function drawGrid() {
        ctx.fillStyle = "#0d1b2a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += gridSize) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(canvas.width, i);
            ctx.stroke();
        }
    }

    function drawSnake() {
        snake.forEach((segment, index) => {
            const isHead = index === 0;
            ctx.save();

            if (isHead) {
                ctx.fillStyle = "#2ecc71";
                ctx.shadowColor = "#2ecc71";
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.arc(
                    segment.x + gridSize / 2, 
                    segment.y + gridSize / 2, 
                    gridSize / 2, 
                    0, 
                    2 * Math.PI
                );
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                let eyeOffsetX = 0;
                let eyeOffsetY = 0;

                if (dx > 0) { eyeOffsetX = 3; eyeOffsetY = 3; }
                else if (dx < 0) { eyeOffsetX = -3; eyeOffsetY = 3; }
                else if (dy > 0) { eyeOffsetX = 3; eyeOffsetY = 3; }
                else if (dy < 0) { eyeOffsetX = 3; eyeOffsetY = -3; }

                ctx.beginPath();
                ctx.arc(
                    segment.x + gridSize / 2 + eyeOffsetX, 
                    segment.y + gridSize / 2 - eyeOffsetY, 
                    2, 0, 2 * Math.PI
                );
                ctx.arc(
                    segment.x + gridSize / 2 + eyeOffsetX, 
                    segment.y + gridSize / 2 + eyeOffsetY, 
                    2, 0, 2 * Math.PI
                );
                ctx.fill();

                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(
                    segment.x + gridSize / 2 + eyeOffsetX, 
                    segment.y + gridSize / 2 - eyeOffsetY, 
                    1, 0, 2 * Math.PI
                );
                ctx.arc(
                    segment.x + gridSize / 2 + eyeOffsetX, 
                    segment.y + gridSize / 2 + eyeOffsetY, 
                    1, 0, 2 * Math.PI
                );
                ctx.fill();

            } else {
                const progress = index / snake.length;
                const radius = (gridSize / 2) * (1 - progress * 0.3);

                ctx.fillStyle = `hsl(${140 - index * 2}, 70%, ${50 - index * 1}%)`;
                ctx.beginPath();
                ctx.arc(
                    segment.x + gridSize / 2, 
                    segment.y + gridSize / 2, 
                    radius, 
                    0, 
                    2 * Math.PI
                );
                ctx.fill();
            }

            ctx.restore();
        });
    }

    function drawFood() {
        ctx.save();
        const centerX = food.x + gridSize / 2;
        const centerY = food.y + gridSize / 2;

        ctx.fillStyle = "#e74c3c";
        ctx.shadowColor = "#e74c3c";
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.arc(centerX, centerY + 1, gridSize / 2 - 2, 0, 2 * Math.PI);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#795548";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - 3);
        ctx.lineTo(centerX + 2, centerY - 7);
        ctx.stroke();

        ctx.fillStyle = "#2ecc71";
        ctx.beginPath();
        ctx.arc(centerX + 3, centerY - 6, 2, 0, 2 * Math.PI);
        ctx.fill();

        ctx.restore();
    }

    function changeDirection(dir) {
        if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -gridSize; }
        if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = gridSize; }
        if (dir === 'LEFT' && dx === 0) { nextDx = -gridSize; nextDy = 0; }
        if (dir === 'RIGHT' && dx === 0) { nextDx = gridSize; nextDy = 0; }
    }

    function handleGameOver() {
        isGameOver = true;
        clearInterval(gameInterval);
        document.getElementById("finalScoreText").innerText = `مجموع نقاطك: ${score}`;
        document.getElementById("gameOverOverlay").classList.add("active");
    }

    function resetGame() {
        initGame();
    }

    document.addEventListener("keydown", (e) => {
        switch (e.key) {
            case "ArrowUp":
                changeDirection('UP');
                break;
            case "ArrowDown":
                changeDirection('DOWN');
                break;
            case "ArrowLeft":
                changeDirection('LEFT');
                break;
            case "ArrowRight":
                changeDirection('RIGHT');
                break;
        }
    });

    initGame();
</script>

</body>
</html>
