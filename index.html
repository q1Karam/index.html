<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحية الكلاسيكية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 560px;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas {
            background-color: #0d1b2a;
            border-radius: 18px;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8), 0 0 25px rgba(46, 204, 113, 0.25);
            border: 3px solid #1b263b;
            max-width: 100%;
            height: auto;
        }

        /* أزرار التحكم للهواتف */
        .touch-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 240px;
            height: 240px;
            margin-top: 15px;
        }

        .arrow-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 26px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
            touch-action: manipulation;
        }

        .arrow-btn:active {
            background: rgba(46, 204, 113, 0.5);
            transform: scale(0.92);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-right-pos { grid-column: 1; grid-row: 2; }
        .btn-left-pos { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .controls-hint {
            margin-top: 12px;
            font-size: 14px;
            color: #a0aab2;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-over-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .game-over-title {
            font-size: 36px;
            color: #e74c3c;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .restart-btn {
            margin-top: 15px;
            background: #2ecc71;
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .restart-btn:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .container-relative {
            position: relative;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="score-board">
        <div class="score-box">النقاط: <span id="currentScore" style="color:#2ecc71;">0</span></div>
        <div class="score-box">أعلى نتيجة: <span id="highScore" style="color:#f1c40f;">0</span></div>
    </div>

    <div class="container-relative">
        <!-- تم تكبير أبعاد الملعب الكلية إلى 560x560 -->
        <canvas id="gameCanvas" width="560" height="560"></canvas>
        
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-title">خسرت!</div>
            <p id="finalScoreText" style="font-size: 20px;"></p>
            <button class="restart-btn" onclick="resetGame()">إعادة اللعب</button>
        </div>
    </div>

    <!-- أزرار التحكم للهواتف -->
    <div class="touch-controls">
        <button class="arrow-btn btn-up" onclick="changeDirection('UP')">▲</button>
        <button class="arrow-btn btn-right-pos" onclick="changeDirection('RIGHT')">▶</button>
        <button class="arrow-btn btn-left-pos" onclick="changeDirection('LEFT')">◀</button>
        <button class="arrow-btn btn-down" onclick="changeDirection('DOWN')">▼</button>
    </div>

    <div class="controls-hint">استخدم أزرار الشاشة للتلفون أو أسهم الكيبورد للكمبيوتر</div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // تم تكبير حجم المربع بشكل ضخم إلى 40px
    const gridSize = 40; 
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let prevSnake = [];
    let food = { x: 0, y: 0 };

    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;

    let score = 0;
    let highScore = localStorage.getItem("snakeHighScore") || 0;
    document.getElementById("highScore").innerText = highScore;

    let isGameOver = false;
    let animationFrameId;
    let lastStepTime = 0;
    
    // سرعة الحركة مع الحفاظ على النعومة الفائقة
    const stepInterval = 170; 

    function easeInOutQuad(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function initGame() {
        snake = [
            { x: 5, y: 7 },
            { x: 4, y: 7 },
            { x: 3, y: 7 }
        ];
        prevSnake = JSON.parse(JSON.stringify(snake));

        score = 0;
        dx = 1;
        dy = 0;
        nextDx = 1;
        nextDy = 0;
        isGameOver = false;
        document.getElementById("currentScore").innerText = score;
        document.getElementById("gameOverOverlay").classList.remove("active");
        spawnFood();
        
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        lastStepTime = performance.now();
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    function gameLoop(currentTime) {
        if (isGameOver) return;

        animationFrameId = requestAnimationFrame(gameLoop);

        let elapsed = currentTime - lastStepTime;

        if (elapsed >= stepInterval) {
            lastStepTime = currentTime;
            elapsed = 0;

            dx = nextDx;
            dy = nextDy;

            prevSnake = JSON.parse(JSON.stringify(snake));
            moveSnake();

            if (checkCollision()) {
                handleGameOver();
                return;
            }
        }

        let rawProgress = Math.min(elapsed / stepInterval, 1);
        let smoothProgress = easeInOutQuad(rawProgress);

        drawGrid();
        drawFood();
        drawSmoothSnake(smoothProgress);
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById("currentScore").innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                document.getElementById("highScore").innerText = highScore;
            }
            spawnFood();
        } else {
            snake.pop();
        }

        snake.unshift(head);
    }

    function checkCollision() {
        const head = snake[0];

        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            return true;
        }

        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                return true;
            }
        }

        return false;
    }

    function spawnFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);

        for (let segment of snake) {
            if (segment.x === food.x && segment.y === food.y) {
                spawnFood();
                break;
            }
        }
    }

    function drawGrid() {
        ctx.fillStyle = "#0d1b2a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // خطوط الشبكة المربّعة أصبحت أوضح وأكبر
        ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
        ctx.lineWidth = 1.5;
        for (let i = 0; i < canvas.width; i += gridSize) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(canvas.width, i);
            ctx.stroke();
        }
    }

    function drawSmoothSnake(progress) {
        snake.forEach((segment, index) => {
            const isHead = index === 0;

            let prev = prevSnake[index] || segment;
            let currentX = (prev.x + (segment.x - prev.x) * progress) * gridSize;
            let currentY = (prev.y + (segment.y - prev.y) * progress) * gridSize;

            ctx.save();

            if (isHead) {
                ctx.fillStyle = "#2ecc71";
                ctx.shadowColor = "#2ecc71";
                ctx.shadowBlur = 18;

                // رأس الدودة ضخم
                ctx.beginPath();
                ctx.arc(
                    currentX + gridSize / 2, 
                    currentY + gridSize / 2, 
                    gridSize / 2 - 1, 
                    0, 
                    2 * Math.PI
                );
                ctx.fill();

                // عيون أضخم وأوضح
                ctx.fillStyle = "#ffffff";
                let eyeOffsetX = dx * 8;
                let eyeOffsetY = dy * 8;

                ctx.beginPath();
                ctx.arc(
                    currentX + gridSize / 2 + eyeOffsetX + (dy * 6), 
                    currentY + gridSize / 2 + eyeOffsetY + (dx * 6), 
                    4.5, 0, 2 * Math.PI
                );
                ctx.arc(
                    currentX + gridSize / 2 + eyeOffsetX - (dy * 6), 
                    currentY + gridSize / 2 + eyeOffsetY - (dx * 6), 
                    4.5, 0, 2 * Math.PI
                );
                ctx.fill();

                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(
                    currentX + gridSize / 2 + eyeOffsetX + (dy * 6), 
                    currentY + gridSize / 2 + eyeOffsetY + (dx * 6), 
                    2.2, 0, 2 * Math.PI
                );
                ctx.arc(
                    currentX + gridSize / 2 + eyeOffsetX - (dy * 6), 
                    currentY + gridSize / 2 + eyeOffsetY - (dx * 6), 
                    2.2, 0, 2 * Math.PI
                );
                ctx.fill();

            } else {
                const headIndexRatio = index / snake.length;
                const radius = (gridSize / 2 - 1) * (1 - headIndexRatio * 0.22);

                ctx.fillStyle = `hsl(${140 - index * 3}, 70%, ${50 - index * 1}%)`;
                ctx.beginPath();
                ctx.arc(
                    currentX + gridSize / 2, 
                    currentY + gridSize / 2, 
                    radius, 
                    0, 
                    2 * Math.PI
                );
                ctx.fill();
            }

            ctx.restore();
        });
    }

    function drawFood() {
        ctx.save();
        const centerX = food.x * gridSize + gridSize / 2;
        const centerY = food.y * gridSize + gridSize / 2;

        ctx.fillStyle = "#e74c3c";
        ctx.shadowColor = "#e74c3c";
        ctx.shadowBlur = 22;

        // رسم التفاحة بأبعاد كبيرة للغاية
        ctx.beginPath();
        ctx.arc(centerX, centerY + 1, gridSize / 2 - 3, 0, 2 * Math.PI);
        ctx.fill();

        // ساق وساق ورقة التفاحة
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#795548";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - 6);
        ctx.lineTo(centerX + 5, centerY - 15);
        ctx.stroke();

        ctx.fillStyle = "#2ecc71";
        ctx.beginPath();
        ctx.arc(centerX + 6, centerY - 11, 4.5, 0, 2 * Math.PI);
        ctx.fill();

        ctx.restore();
    }

    function changeDirection(dir) {
        if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
        if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
        if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
        if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
    }

    function handleGameOver() {
        isGameOver = true;
        cancelAnimationFrame(animationFrameId);
        document.getElementById("finalScoreText").innerText = `مجموع نقاطك: ${score}`;
        document.getElementById("gameOverOverlay").classList.add("active");
    }

    function resetGame() {
        initGame();
    }

    document.addEventListener("keydown", (e) => {
        switch (e.key) {
            case "ArrowUp":
                changeDirection('UP');
                break;
            case "ArrowDown":
                changeDirection('DOWN');
                break;
            case "ArrowLeft":
                changeDirection('LEFT');
                break;
            case "ArrowRight":
                changeDirection('RIGHT');
                break;
        }
    });

    initGame();
</script>

</body>
</html>
