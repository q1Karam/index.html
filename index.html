<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحية الكلاسيكية - أونلاين</title>
    
    <!-- مكتبات Firebase للحفظ السحابي وتحديث الجدول بين جميع اللاعبين -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 32, 39, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .welcome-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 380px;
        }

        .welcome-title {
            font-size: 24px;
            color: #2ecc71;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .welcome-desc {
            font-size: 14px;
            color: #a0aab2;
            margin-bottom: 20px;
        }

        .name-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #2ecc71;
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .start-btn {
            background: #2ecc71;
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.1s;
        }

        .start-btn:active {
            transform: scale(0.96);
            background: #27ae60;
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            gap: 15px;
            align-items: flex-start;
            max-width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .side-leaderboard {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px;
            width: 220px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            max-height: 560px;
            overflow-y: auto;
        }

        .leaderboard-title {
            font-size: 15px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .player-name-tag {
            color: #2ecc71;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 110px;
        }

        .score-tag {
            color: #f1c40f;
            font-weight: bold;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 560px;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: bold;
            gap: 10px;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        canvas {
            background-color: #0d1b2a;
            border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 0 15px rgba(46, 204, 113, 0.15);
            border: 2px solid #1b263b;
            max-width: 100%;
            height: auto;
        }

        .touch-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 210px;
            height: 210px;
            margin-top: 14px;
        }

        .arrow-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 22px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.05s, transform 0.05s;
            touch-action: manipulation;
        }

        .arrow-btn:active {
            background: rgba(46, 204, 113, 0.6);
            transform: scale(0.90);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-right-pos { grid-column: 1; grid-row: 2; }
        .btn-left-pos { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .container-relative {
            position: relative;
        }
    </style>
</head>
<body>

<div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-box">
        <div class="welcome-title">مرحباً بك! 🐍</div>
        <div class="welcome-desc">أدخل اسمك لحفظ نقاطك وتنافس في الجدول العالم العام:</div>
        <input type="text" id="playerNameInput" class="name-input" placeholder="اكتب اسمك هنا..." maxlength="12">
        <button class="start-btn" onclick="submitNameAndStart()">دخول واللعب</button>
    </div>
</div>

<div class="main-layout">

    <div class="game-card">
        <div class="score-board">
            <div class="score-box">النقاط: <span id="currentScore" style="color:#2ecc71;">0</span></div>
            <div class="score-box">
                أعلى سكور لك (<span id="topPlayerNameDisplay" style="color:#2ecc71;">---</span>): 
                <span id="highScore" style="color:#f1c40f;">0</span>
            </div>
        </div>

        <div class="container-relative">
            <canvas id="gameCanvas" width="560" height="560"></canvas>
            
            <div class="modal-overlay" id="gameOverOverlay">
                <div style="font-size: 22px; color:#e74c3c; font-weight:bold; margin-bottom: 10px;">خسرت!</div>
                <p id="finalScoreText" style="font-size: 16px; margin-bottom: 12px;"></p>
                <button class="start-btn" style="width:auto;" onclick="resetGame()">إعادة اللعب</button>
            </div>
        </div>

        <div class="touch-controls">
            <button class="arrow-btn btn-up" id="btnUp">▲</button>
            <button class="arrow-btn btn-right-pos" id="btnRight">▶</button>
            <button class="arrow-btn btn-left-pos" id="btnLeft">◀</button>
            <button class="arrow-btn btn-down" id="btnDown">▼</button>
        </div>
    </div>

    <!-- جدول المتصدرين العالمي لجميع اللاعبين -->
    <div class="side-leaderboard">
        <div class="leaderboard-title">🏆 جدول المتصدرين (أونلاين)</div>
        <div id="leaderboardList">
            <div style="text-align: center; color:#888; font-size:12px;">جاري تحميل النتائج...</div>
        </div>
    </div>

</div>

<script>
    // --- إعدادات قاعدة البيانات السحابية (Firebase) ---
    // لربط اللعبة بسحابتك الخاصة بشكل متكامل، يمكنك استبدال المفاتيح التالية بمفاتيح مشروتك المجاني في Firebase:
    const firebaseConfig = {
        apiKey: "AIzaSyDemoKeyReplaceWithYours",
        authDomain: "snake-game-demo.firebaseapp.com",
        databaseURL: "https://snake-game-demo-default-rtdb.firebaseio.com",
        projectId: "snake-game-demo",
        storageBucket: "snake-game-demo.appspot.com",
        messagingSenderId: "1234567890",
        appId: "1:1234567890:web:demo"
    };

    let database = null;
    try {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
    } catch(e) {
        console.log("Firebase initialized in local/offline fallback mode.");
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const gridSize = 28; 
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let prevSnake = [];
    let food = { x: 0, y: 0 };

    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let directionChangedThisStep = false;

    let score = 0;
    let playerName = "";
    let highScore = 0;

    let isGameOver = false;
    let animationFrameId;
    let lastStepTime = 0;
    const stepInterval = 130; 

    window.onload = function() {
        let savedName = localStorage.getItem("snake_player_name");
        highScore = localStorage.getItem("snake_high_score") || 0;

        listenToGlobalLeaderboard();

        if (savedName) {
            playerName = savedName;
            document.getElementById("welcomeScreen").style.display = "none";
            updateLeaderboardUI();
            initGame();
        } else {
            document.getElementById("welcomeScreen").style.display = "flex";
        }
    };

    function submitNameAndStart() {
        const input = document.getElementById("playerNameInput");
        const val = input.value.trim();
        
        if (val !== "") {
            playerName = val;
        } else {
            playerName = "لاعب " + Math.floor(100 + Math.random() * 900);
        }

        localStorage.setItem("snake_player_name", playerName);
        document.getElementById("welcomeScreen").style.display = "none";
        
        updateLeaderboardUI();
        initGame();
    }

    function saveScoreToCloud(pName, pScore) {
        if (database) {
            database.ref('leaderboard/' + pName).set({
                name: pName,
                score: parseInt(pScore)
            });
        }
    }

    function listenToGlobalLeaderboard() {
        if (database) {
            database.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', (snapshot) => {
                const leaderboardList = document.getElementById("leaderboardList");
                leaderboardList.innerHTML = "";
                let players = [];

                snapshot.forEach((child) => {
                    players.push(child.val());
                });

                players.sort((a, b) => b.score - a.score);

                players.forEach((p, index) => {
                    const row = document.createElement("div");
                    row.className = "leaderboard-row";
                    row.innerHTML = `
                        <span class="player-name-tag">${index + 1}. ${p.name}</span>
                        <span class="score-tag">${p.score}</span>
                    `;
                    leaderboardList.appendChild(row);
                });
            });
        } else {
            updateLeaderboardUI();
        }
    }

    function updateLeaderboardUI() {
        document.getElementById("highScore").innerText = highScore;
        document.getElementById("topPlayerNameDisplay").innerText = playerName || "---";

        if (!database) {
            const leaderboardList = document.getElementById("leaderboardList");
            leaderboardList.innerHTML = `
                <div class="leaderboard-row">
                    <span class="player-name-tag">${playerName || 'أنت'}</span>
                    <span class="score-tag">${highScore}</span>
                </div>
            `;
        }
    }

    function easeInOutQuad(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function initGame() {
        snake = [
            { x: 5, y: 5 },
            { x: 4, y: 5 },
            { x: 3, y: 5 }
        ];
        prevSnake = JSON.parse(JSON.stringify(snake));

        score = 0;
        dx = 1;
        dy = 0;
        nextDx = 1;
        nextDy = 0;
        directionChangedThisStep = false;
        isGameOver = false;

        document.getElementById("currentScore").innerText = score;
        document.getElementById("gameOverOverlay").classList.remove("active");
        spawnFood();
        
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        lastStepTime = performance.now();
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    function gameLoop(currentTime) {
        if (isGameOver) return;

        animationFrameId = requestAnimationFrame(gameLoop);

        let elapsed = currentTime - lastStepTime;

        if (elapsed >= stepInterval) {
            lastStepTime = currentTime;
            elapsed = 0;

            dx = nextDx;
            dy = nextDy;
            directionChangedThisStep = false;

            prevSnake = JSON.parse(JSON.stringify(snake));
            moveSnake();

            if (checkCollision()) {
                handleGameOver();
                return;
            }
        }

        let rawProgress = Math.min(elapsed / stepInterval, 1);
        let smoothProgress = easeInOutQuad(rawProgress);

        drawGrid();
        drawFood();
        drawSmoothSnake(smoothProgress);
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById("currentScore").innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snake_high_score", highScore);
                saveScoreToCloud(playerName, highScore);
                updateLeaderboardUI();
            }
            spawnFood();
        } else {
            snake.pop();
        }

        snake.unshift(head);
    }

    function checkCollision() {
        const head = snake[0];

        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            return true;
        }

        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                return true;
            }
        }

        return false;
    }

    function spawnFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);

        for (let segment of snake) {
            if (segment.x === food.x && segment.y === food.y) {
                spawnFood();
                break;
            }
        }
    }

    function drawGrid() {
        ctx.fillStyle = "#0d1b2a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += gridSize) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(canvas.width, i);
            ctx.stroke();
        }
    }

    function drawSmoothSnake(progress) {
        snake.forEach((segment, index) => {
            const isHead = index === 0;

            let prev = prevSnake[index] || segment;
            let currentX = (prev.x + (segment.x - prev.x) * progress) * gridSize;
            let currentY = (prev.y + (segment.y - prev.y) * progress) * gridSize;

            ctx.save();

            if (isHead) {
                ctx.fillStyle = "#2ecc71";
                ctx.shadowColor = "#2ecc71";
                ctx.shadowBlur = 12;

                ctx.beginPath();
                ctx.arc(
                    currentX + gridSize / 2, 
                    currentY + gridSize / 2, 
                    gridSize / 2 - 1, 
                    0, 
                    2 * Math.PI
                );
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                let eyeOffsetX = dx * 4;
                let eyeOffsetY = dy * 4;

                ctx.beginPath();
                ctx.arc(
                    currentX + gridSize / 2 + eyeOffsetX + (dy * 3), 
                    currentY + gridSize / 2 + eyeOffsetY + (dx * 3), 
                    2.8, 0, 2 * Math.PI
                );
                ctx.arc(
                    currentX + gridSize / 2 + eyeOffsetX - (dy * 3), 
                    currentY + gridSize / 2 + eyeOffsetY - (dx * 3), 
                    2.8, 0, 2 * Math.PI
                );
                ctx.fill();

                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(
                    currentX + gridSize / 2 + eyeOffsetX + (dy * 3), 
                    currentY + gridSize / 2 + eyeOffsetY + (dx * 3), 
                    1.4, 0, 2 * Math.PI
                );
                ctx.arc(
                    currentX + gridSize / 2 + eyeOffsetX - (dy * 3), 
                    currentY + gridSize / 2 + eyeOffsetY - (dx * 3), 
                    1.4, 0, 2 * Math.PI
                );
                ctx.fill();

            } else {
                const headIndexRatio = index / snake.length;
                const radius = (gridSize / 2 - 1) * (1 - headIndexRatio * 0.22);

                ctx.fillStyle = `hsl(${140 - index * 3}, 70%, ${50 - index * 1}%)`;
                ctx.beginPath();
                ctx.arc(
                    currentX + gridSize / 2, 
                    currentY + gridSize / 2, 
                    radius, 
                    0, 
                    2 * Math.PI
                );
                ctx.fill();
            }

            ctx.restore();
        });
    }

    function drawFood() {
        ctx.save();
        const centerX = food.x * gridSize + gridSize / 2;
        const centerY = food.y * gridSize + gridSize / 2;

        ctx.fillStyle = "#e74c3c";
        ctx.shadowColor = "#e74c3c";
        ctx.shadowBlur = 14;

        ctx.beginPath();
        ctx.arc(centerX, centerY + 1, gridSize / 2 - 2, 0, 2 * Math.PI);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#795548";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - 4);
        ctx.lineTo(centerX + 3, centerY - 8);
        ctx.stroke();

        ctx.fillStyle = "#2ecc71";
        ctx.beginPath();
        ctx.arc(centerX + 4, centerY - 6, 2.5, 0, 2 * Math.PI);
        ctx.fill();

        ctx.restore();
    }

    function changeDirection(dir) {
        if (directionChangedThisStep) return;

        if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; directionChangedThisStep = true; }
        if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; directionChangedThisStep = true; }
        if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; directionChangedThisStep = true; }
        if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; directionChangedThisStep = true; }
    }

    function handleGameOver() {
        isGameOver = true;
        cancelAnimationFrame(animationFrameId);
        document.getElementById("finalScoreText").innerText = `${playerName}، نقاطك: ${score}`;
        document.getElementById("gameOverOverlay").classList.add("active");
        
        saveScoreToCloud(playerName, highScore);
    }

    function resetGame() {
        initGame();
    }

    function bindTouchButton(id, dir) {
        const btn = document.getElementById(id);
        const trigger = (e) => {
            e.preventDefault();
            changeDirection(dir);
        };
        btn.addEventListener("touchstart", trigger, { passive: false });
        btn.addEventListener("mousedown", trigger);
    }

    bindTouchButton("btnUp", 'UP');
    bindTouchButton("btnDown", 'DOWN');
    bindTouchButton("btnLeft", 'LEFT');
    bindTouchButton("btnRight", 'RIGHT');

    document.addEventListener("keydown", (e) => {
        switch (e.key) {
            case "ArrowUp":
                changeDirection('UP');
                break;
            case "ArrowDown":
                changeDirection('DOWN');
                break;
            case "ArrowLeft":
                changeDirection('LEFT');
                break;
            case "ArrowRight":
                changeDirection('RIGHT');
                break;
        }
    });
</script>

</body>
</html>
